[platformio]
default_envs = monitor_lora_lp
build_dir = C:/Users/steve/.pio-build/ws2000-lora-control
libdeps_dir = C:/Users/steve/.pio-libdeps/ws2000-lora-control

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200
lib_deps =
  sandeepmistry/LoRa @ ^0.8.0
  bblanchon/ArduinoJson @ ^7.1.0
  adafruit/Adafruit SSD1306 @ ^2.5.11
  adafruit/Adafruit GFX Library @ ^1.11.9
build_flags =
  -D LORA_FREQ_MHZ=923.0
  -D LORA_BW_HZ=125000.0
  -D LORA_SF=9
  -D LORA_CR=5
  -D LORA_TX_PWR=17
  -D LORA_PIN_SS=18
  -D LORA_PIN_RST=14
  -D LORA_PIN_DIO0=26
  -D CM1107_ENABLED=1
  -D CM1107_BAUD=9600
  -D CM1107_RX_PIN=34
  -D CM1107_TX_PIN=-1
  -D I2C_SDA_PIN=21
  -D I2C_SCL_PIN=22
  -D PMU_ENABLED=1
  -D PMU_ADDR=0x34
  -D SCD41_ENABLED=1
  -D SCD41_ADDR=0x62

[env:gateway]
extends = env
upload_port = COM8
lib_deps =
  ${env.lib_deps}
build_src_filter =
  +<gateway_main.cpp>
build_flags =
  ${env.build_flags}
  -D WIFI_SSID=\"ukphotoguy\"
  -D WIFI_PASS=\"shrewsbury\"
  -D SERVER_BASE_URL=\"http://192.168.1.49:8080\"
  -D PMU_VBAT_GAIN=1.0
  -D PMU_VBAT_OFFSET=1.04
  -D GATEWAY_ID=\"gw-main\"
  -D NODE_ID=\"base\"

[env:control_wifi]
extends = env
upload_port = COM8
build_src_filter =
  +<control_monitor_main.cpp>
build_flags =
  ${env.build_flags}
  -D NODE_ID=\"control-node\"
  -D SENSOR_TX_INTERVAL_MS=10000
  -D I2C_SDA_PIN=21
  -D I2C_SCL_PIN=22
  -D LEAK_DIGITAL_PIN=-1
  -D LEAK_ACTIVE_LEVEL=0
  -D GARAGE_DOOR_PIN=-1
  -D SIDE_DOOR_PIN=-1
  -D MOTION_PIN=-1
  -D LIGHT_SENSE_PIN=-1
  -D BUZZER_PIN=4
  -D BUZZER_ACTIVE_HIGH=1
  -D ALARM_SILENCE_PIN=38
  -D ALARM_SILENCE_ACTIVE_LEVEL=0
  -D ALARM_SILENCE_USE_PULLUP=0
  -D OLED_ENABLED=1
  -D OLED_ADDR=0x3C
  -D OLED_W=128
  -D OLED_H=64
  -D SCD41_LOCAL_ENABLED=1
  -D SCD41_LOCAL_ADDR=0x62
  -D SYNTHETIC_BATTERY_ENABLED=0
  -D BATTERY_VOLTAGE_GAIN=1.0
  -D BATTERY_VOLTAGE_OFFSET=1.04
  -D SENSOR_PWR_PIN=13
  -D SENSOR_PWR_ACTIVE_HIGH=1
  -D CONTROL_WIFI_DIRECT=1
  -D WIFI_SSID=\"ukphotoguy\"
  -D WIFI_PASS=\"shrewsbury\"
  -D SERVER_BASE_URL=\"http://192.168.1.49:8080\"
  -D BOARD_LED_PIN=2
  -D BOARD_LED_ACTIVE_LOW=1
  -D SECONDARY_LED_PIN=-1
  -D AUX_UART_RX_PIN=16
  -D AUX_UART_TX_PIN=17

[env:sensor_test_tx]
extends = env
build_src_filter =
  +<control_monitor_main.cpp>
build_flags =
  ${env.build_flags}
  -D NODE_ID=\"test-node\"
  -D SENSOR_TX_INTERVAL_MS=5000
  -D LOW_POWER_MODE=1
  -D SENSOR_SLEEP_SECONDS=300
  -D I2C_SDA_PIN=21
  -D I2C_SCL_PIN=22
  -D LEAK_DIGITAL_PIN=23
  -D LEAK_ACTIVE_LEVEL=0
  -D GARAGE_DOOR_PIN=32
  -D SIDE_DOOR_PIN=33
  -D MOTION_PIN=25
  -D LIGHT_SENSE_PIN=35
  -D BUZZER_PIN=4
  -D BUZZER_ACTIVE_HIGH=1
  -D ALARM_SILENCE_PIN=15
  -D OLED_ENABLED=1
  -D OLED_ADDR=0x3C
  -D OLED_W=128
  -D OLED_H=64
  -D SCD41_LOCAL_ENABLED=1
  -D SCD41_LOCAL_ADDR=0x62
  -D SENSOR_PWR_PIN=13
  -D SENSOR_PWR_ACTIVE_HIGH=1
  -D SENSOR_PWR_WARMUP_MS=1500
  -D AUX_UART_RX_PIN=16
  -D AUX_UART_TX_PIN=17
  -D BOARD_LED_PIN=2
  -D BOARD_LED_ACTIVE_LOW=1
  -D SECONDARY_LED_PIN=-1

[env:monitor_lora_lp]
extends = env
upload_port = COM9
build_src_filter =
  +<control_monitor_main.cpp>
build_flags =
  ${env.build_flags}
  -D NODE_ID=\"monitor-node\"
  -D LOW_POWER_MODE=0
  -D SENSOR_SLEEP_SECONDS=120
  -D I2C_SDA_PIN=21
  -D I2C_SCL_PIN=22
  -D LEAK_DIGITAL_PIN=4
  -D LEAK_ACTIVE_LEVEL=0
  -D GARAGE_DOOR_PIN=25
  -D SIDE_DOOR_PIN=-1
  -D MOTION_PIN=15
  -D LIGHT_SENSE_PIN=-1
  -D BUZZER_PIN=-1
  -D ALARM_SILENCE_PIN=-1
  -D IO4_IDLE_LEVEL=-1
  -D OLED_ENABLED=0
  -D SCD41_LOCAL_ENABLED=1
  -D SCD41_LOCAL_ADDR=0x62
  -D SHT3X_LOCAL_ENABLED=1
  -D SHT3X_LOCAL_ADDR=0x44
  -D SYNTHETIC_BATTERY_ENABLED=0
  -D BATTERY_VOLTAGE_GAIN=1.0
  -D BATTERY_VOLTAGE_OFFSET=0.20
  -D ACTIVE_DIAG_ENABLED=1
  -D ACTIVE_DIAG_INTERVAL_MS=2000
  -D SENSOR_PWR_PIN=13
  -D SENSOR_PWR_ACTIVE_HIGH=1
  -D SENSOR_PWR_WARMUP_MS=1500
  -D AUX_UART_RX_PIN=16
  -D AUX_UART_TX_PIN=17

[env:i2c_scan]
extends = env
upload_port = COM8
build_src_filter =
  +<i2c_scan_main.cpp>
build_flags =
  ${env.build_flags}
  -D I2C_SDA_PIN=21
  -D I2C_SCL_PIN=22

[env:pmu_probe]
extends = env
upload_port = COM8
build_src_filter =
  +<pmu_probe_main.cpp>
build_flags =
  ${env.build_flags}
  -D I2C_SDA_PIN=21
  -D I2C_SCL_PIN=22
  -D PMU_ADDR=0x34

[env:oled_roll_test]
extends = env
upload_port = COM8
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.11
  adafruit/Adafruit GFX Library @ ^1.11.9
build_src_filter =
  +<oled_roll_main.cpp>
build_flags =
  ${env.build_flags}
  -D I2C_SDA_PIN=21
  -D I2C_SCL_PIN=22
  -D OLED_ADDR=0x3C
  -D OLED_W=128
  -D OLED_H=64
