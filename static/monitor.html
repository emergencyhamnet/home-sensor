<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monitor Sensors</title>
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0f1115;
      color: #e7eaf0;
      -webkit-text-size-adjust: 100%;
      margin-bottom: 60px;
    }
    .wrap { max-width: none; margin: 0 auto; padding: 16px 18px; }
    .card {
      background:#161a22;
      border:1px solid #252b36;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,.25);
      margin-bottom: 14px;
    }
    .title {
      font-size: 14px;
      opacity:.8;
      letter-spacing:.02em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .subtle { opacity: .75; }
    .sensorGrid:before, .sensorGrid:after { content: " "; display: table; }
    .sensorGrid:after { clear: both; }
    .sensorCard {
      float: left;
      width: 49%;
      margin: 0 0 14px 0;
      background:#161a22;
      border:1px solid #252b36;
      border-radius: 14px;
      padding: 16px;
    }
    .sensorCard.even { float: right; }
    .sensorName {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .row { font-size: 24px; line-height: 1.3; }
    .label {
      font-size: 14px;
      opacity: .8;
      text-transform: uppercase;
      letter-spacing: .02em;
      margin-right: 8px;
    }
    .empty {
      padding: 24px;
      text-align: center;
      font-size: 20px;
      opacity: .8;
      background:#161a22;
      border:1px solid #252b36;
      border-radius: 14px;
    }
    .navBar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50px;
      background: #161a22;
      border-top: 1px solid #252b36;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 8px;
      z-index: 1000;
    }
    .navBar button {
      flex: 1;
      max-width: 200px;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: 700;
      background: #252b36;
      color: #e7eaf0;
      border: 1px solid #3d444f;
      border-radius: 8px;
      cursor: pointer;
    }
    .navBar button.active { background: #0f8dff; border-color: #0f8dff; }
    .navBar button:hover { background: #3d444f; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="title">Monitor Sensors</div>
      <div>Updated: <span id="updated" class="subtle">--</span></div>
      <div>Detected sensors: <span id="count">0</span></div>
    </div>

    <div class="card">
      <div class="title">Gateway Air Quality</div>
      <div class="row"><span class="label">CO₂</span><span id="baseCo2">--</span> ppm</div>
      <div class="row"><span class="label">Temp</span><span id="baseTemp">--</span> °F</div>
      <div class="row"><span class="label">Humidity</span><span id="baseRh">--</span> %</div>
      <div class="row"><span class="label">VOC Index</span><span id="baseVoc">--</span></div>
    </div>

    <div class="card">
      <div class="title">Alerts</div>
      <div id="alerts">No active alerts.</div>
    </div>

    <div id="sensorGrid" class="sensorGrid"></div>
    <div id="empty" class="empty" style="display:none;">No monitor sensors detected yet.</div>
  </div>

  <div class="navBar">
    <button class="navBtn" data-screen="weatherScreen" onclick="navClick(this)">Weather</button>
    <button class="navBtn" data-screen="camerasScreen" onclick="navClick(this)">Cameras</button>
    <button class="navBtn active" data-screen="monitorScreen" onclick="navClick(this)">Monitor</button>
  </div>

<script>
function navClick(btn) {
  var screenId = btn.getAttribute('data-screen');
  if (screenId === 'weatherScreen') {
    window.location.href = '/';
  } else if (screenId === 'camerasScreen') {
    window.location.href = '/cameras';
  } else if (screenId === 'monitorScreen') {
    window.location.href = '/monitor';
  }
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function numOrDash(v, digits) {
  if (v === null || v === undefined || v === '') return '--';
  var n = parseFloat(v);
  if (isNaN(n)) return '--';
  return n.toFixed(digits);
}

function textOrDash(v) {
  return (v === null || v === undefined || v === '') ? '--' : String(v);
}

function renderSensors(sensors) {
  var grid = document.getElementById('sensorGrid');
  var empty = document.getElementById('empty');
  if (!grid || !empty) return;

  if (!sensors || !sensors.length) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  var html = '';
  var i;
  for (i = 0; i < sensors.length; i++) {
    var s = sensors[i] || {};
    var cls = (i % 2 === 1) ? 'sensorCard even' : 'sensorCard';
    html += '<div class="' + cls + '">'
      + '<div class="sensorName">' + escHtml(textOrDash(s.name)) + '</div>'
      + '<div class="row"><span class="label">Temp</span>' + escHtml(numOrDash(s.temperature_f, 1)) + ' °F</div>'
      + '<div class="row"><span class="label">Humidity</span>' + escHtml(numOrDash(s.humidity, 0)) + ' %</div>'
      + '<div class="row"><span class="label">Leak</span>' + escHtml(textOrDash(s.leak)) + '</div>'
      + '<div class="row"><span class="label">Wet</span>' + escHtml(numOrDash(s.wet, 0)) + '</div>'
      + '<div class="row"><span class="label">Battery</span>' + escHtml(textOrDash(s.battery)) + '</div>'
      + '<div class="row"><span class="label">RSSI</span>' + escHtml(numOrDash(s.rssi, 0)) + '</div>'
      + '<div class="row"><span class="label">SNR</span>' + escHtml(numOrDash(s.snr, 1)) + '</div>'
      + '<div class="row"><span class="label">Offline</span>' + escHtml(s.offline ? 'YES' : 'No') + '</div>'
      + '</div>';
  }
  grid.innerHTML = html;
}

function setText(id, value) {
  var el = document.getElementById(id);
  if (el) el.textContent = value;
}

function renderAlerts(alerts) {
  var el = document.getElementById('alerts');
  if (!el) return;
  if (!alerts || !alerts.length) {
    el.textContent = 'No active alerts.';
    return;
  }

  var html = '';
  var i;
  for (i = 0; i < alerts.length; i++) {
    var a = alerts[i] || {};
    html += '<div class="row">' + escHtml(textOrDash(a.severity).toUpperCase()) + ': ' + escHtml(textOrDash(a.message)) + '</div>';
  }
  el.innerHTML = html;
}

function update() {
  try {
    var xhr = new XMLHttpRequest();
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status !== 200) return;

      var d;
      try {
        d = JSON.parse(xhr.responseText);
      } catch (e) {
        return;
      }

      var ts = (d && d.timestamp) ? String(d.timestamp) : '--';
      var count = (d && d.sensor_count !== undefined && d.sensor_count !== null) ? String(d.sensor_count) : '0';

      var updated = document.getElementById('updated');
      var countEl = document.getElementById('count');
      if (updated) updated.textContent = ts;
      if (countEl) countEl.textContent = count;

      renderSensors(d && d.sensors ? d.sensors : []);
      renderAlerts(d && d.alerts ? d.alerts : []);

      var b = d && d.base ? d.base : null;
      setText('baseCo2', numOrDash(b ? b.co2_ppm : null, 0));
      setText('baseTemp', numOrDash(b ? b.temperature_f : null, 1));
      setText('baseRh', numOrDash(b ? b.rh : null, 0));
      setText('baseVoc', numOrDash(b ? b.voc_index : null, 0));
    };

    xhr.open('GET', '/monitor_data?_=' + new Date().getTime(), true);
    xhr.send(null);
  } catch (e) {
    // keep previous values
  }
}

update();
setInterval(update, 5000);
</script>
</body>
</html>
